{% load static %}
<html>
    <head>
        <title>This is admissions view page</title>
        <!-- <link rel="stylesheet" href="{% static 'stylesheets/style.css' %}"/> -->
    </head>
    <body>
            <table border="1">
                <tr>
                    <th>Id</th>
                    <th>student_name</th>
                    <th>father_name</th>
                    <th>dob</th>
                    <th>course_opted</th>
                    <th>Registration_fee</th>
                    <th>update record</th>
                    <th>delete record</th>
                </tr>
                {% for s in objects %}
                <tr>
                    <td><a href="/ad/readaddedrow/{{s.id}}">{{s.id}}</a></td>
                    <td>{{s.student_name}}</td>
                    <td>{{s.father_name}}</td>
                    <td>{{s.dob}}</td>
                    <td>{{s.course_opted}}</td>
                    <td>{{s.Registration_fee}}</td>
                    <td><a href="/ad/updaterecord/{{s.id}}">update</a></td>
                    <td><a href="/ad/deleterecord/{{s.id}}">delete</a></td>
                {% endfor %}
                </tr>
            </table>
            
            <br><br>
            <a href="{% url 'homepage' %}"><button type="button" name="button">Back</button></a>
    </body>
</html>
