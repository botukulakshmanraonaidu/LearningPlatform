<html>
    <head>
        <title>This is java tranning class</title>
    </head>

        <table border="1">
            <tr>

            <th>student_name</th>
            <th>father_name</th>
            <th>dob</th>
            <th>course_opted</th>

            </tr>
            <button type="button" name="button">download</button>
        </table>
    </body>
</html>
